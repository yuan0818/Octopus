services:

  git:
    build:
      context: .
      dockerfile: Dockerfile.git
    container_name: octopus-git
    ports:
      - "8081:8081"
    volumes:
      - ~/workspace:/workspace:ro
      # 仓库存储根：同径挂载（容器内外同一路径），所有服务共享同一网络卷
      - ${OCTOPUS_REPO_ROOT:-/data/repos}:${OCTOPUS_REPO_ROOT:-/data/repos}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: octopus-frontend
    ports:
      - "3000:3000"

