spring:
  application:
    name: octopus

  git:
    host: localhost:29418
    username: octopus
    password: ${GIT_PASSWORD}
    # 仓库存储根：所有需要读仓库文件的服务（git/reconstruct/PSI/Go）统一用
    # OCTOPUS_REPO_ROOT，同一路径语义（单一写者=GitService，其余只读）
    local-repo-base: ${OCTOPUS_REPO_ROOT:/data/repos}

  datasource:
    url: jdbc:mysql://localhost:3306/octopus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

octopus:
  encryption:
    secret-key: ${OCTOPUS_ENCRYPTION_KEY}           # MUST be 16, 24, or 32 bytes for AES; change in production!
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: ${NEO4J_PASSWORD:octpus123}
  psi:
    timeout-seconds: 1500
    connect-retry-attempts: 3
    connect-retry-interval-seconds: 5
    service-url: http://localhost:8377     # PSI HTTP service (runIde)
  go:
    service-url: http://localhost:8378      # go-project-analyzer (run-go-analyzer-local.sh)
    timeout-seconds: 600
    connect-retry-attempts: 3
    connect-retry-interval-seconds: 5
  git:
    shallow-clone: true
    local-repo-ttl-days: 30
    local-repo-max-count: 50
    local-repo-max-size-gb: 100
    service-url: http://localhost:8081     # git service runs in Docker, port-mapped to localhost:8081
  review-agent:
    service-url: http://localhost:8083      # octopus-review-agent
  source-reconstruct:
    url: http://localhost:8082              # octopus-code-reconstruct（git 源码读取）
  gerrit:
    webhook-token-header: X-Gerrit-Token
    octopus-base-url: http://localhost:8080  # for Gerrit comment detail links
  change-review:
    enabled: ${CHANGE_REVIEW_ENABLED:true}  # feature flag; when false, webhook returns 410 and consumer stays idle
    comment-top-n: 10
    review-endpoint-timeout-seconds: 120
    default-skill-id: code-review

spring.rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:guest}
  password: ${RABBITMQ_PASSWORD:guest}
  listener:
    simple:
      acknowledge-mode: manual
      prefetch: 1
