plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // ── Infra modules ──────────────────────────────────────────
    implementation platform(project(':octopus-infra:infra-bom'))
    implementation project(':octopus-infra:infra-common')
    implementation project(':octopus-infra:infra-neo4j')
    implementation project(':octopus-infra:infra-mysql')
    implementation project(':octopus-infra:infra-jgit')
    implementation project(':octopus-infra:infra-memory')

    // ── Spring Boot ─────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // ── Core dependencies ───────────────────────────────────────
    implementation 'org.eclipse.jgit:org.eclipse.jgit'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.ssh.apache'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core'
    implementation 'com.google.code.gson:gson'

    // ── Dev / annotation ────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // ── Test ─────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testImplementation 'org.testcontainers:neo4j:1.20.4'
    testImplementation 'org.testcontainers:mysql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
