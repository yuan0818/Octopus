plugins { id 'java-library' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    // Match Platform's Query parser, including its handling of already-decoded URI query text.
    implementation 'cn.hutool:hutool-core:5.8.16'
    // Reuse JMeter's Jackson for byte-for-byte Gateway JSON semantics; do not ship a second copy.
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    // Platform's pinned crypto implementation, for protocol compatibility tests only.
    testImplementation 'cn.hutool:hutool-crypto:5.8.16'
    api 'com.google.code.gson:gson:2.11.0'
    // Extension SDK (annotations, OctopusFunction, naming rules) ships in JMeter lib/ so uploaded extensions can link to it.
    api project(':octopus-jmeter-sdk')
    // JMeter supplies these at runtime; needed for the extension invoker and verification probe.
    compileOnly 'org.apache.jmeter:ApacheJMeter_core:5.6.3'
    compileOnly 'org.apache.jmeter:jorphan:5.6.3'
    testImplementation 'org.apache.jmeter:ApacheJMeter_core:5.6.3'
    testImplementation 'org.apache.jmeter:jorphan:5.6.3'
    // Whitelisted built-in functions (jm.*) live in ApacheJMeter_functions; JMeter ships it in lib/ext.
    testImplementation 'org.apache.jmeter:ApacheJMeter_functions:5.6.3'
    implementation 'redis.clients:jedis:5.2.0'
    implementation 'org.apache.kafka:kafka-clients:4.1.2'
    runtimeOnly 'com.mysql:mysql-connector-j:9.6.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.10'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.h2database:h2:2.3.232'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('jar') {
    archiveFileName = 'octopus-jmeter-ext-1.jar'
    manifest { attributes('Implementation-Version': '1', 'Implementation-Title': 'Octopus JMeter runtime', 'Octopus-Preparation-Version': '1') }
}
// Portable JMeter extension distribution. JMeter 5.6.3 supplies logging and commons-pool2.
tasks.register('distribution', Sync) {
    dependsOn jar
    into layout.buildDirectory.dir('jmeter-extension')
    from(tasks.named('jar')) { into 'lib/ext' }
    from(configurations.runtimeClasspath) {
        exclude 'slf4j-api-*', 'commons-pool2-*'
        into 'lib'
    }
}
