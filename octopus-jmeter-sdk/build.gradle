plugins { id 'java-library' }

// Octopus JMeter extension SDK: annotations + optional base class for user-written JMeter functions.
// Compile-only dependency for extension authors; JMeter supplies its own classes at runtime.
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

// Extensions may be built with Java 17+; the SDK must not force a newer bytecode level.
tasks.withType(JavaCompile).configureEach { options.release = 17 }

dependencies {
    compileOnly 'org.apache.jmeter:ApacheJMeter_core:5.6.3'
    compileOnly 'org.apache.jmeter:jorphan:5.6.3'
    testImplementation 'org.apache.jmeter:ApacheJMeter_core:5.6.3'
    testImplementation 'org.apache.jmeter:jorphan:5.6.3'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    archiveFileName = 'octopus-jmeter-sdk-1.jar'
    manifest { attributes('Implementation-Title': 'Octopus JMeter extension SDK', 'Implementation-Version': '1', 'Octopus-Extension-Sdk-Version': '1') }
}
