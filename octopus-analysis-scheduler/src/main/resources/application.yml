server:
  port: 8085

spring:
  application:
    name: octopus-analysis-scheduler
  datasource:
    url: jdbc:mysql://localhost:3306/octopus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${OCTOPUS_DDL_AUTO:update}   # 生产环境建议 validate（表结构由迁移脚本管理）
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

analysis:
  task-timeout-seconds: 1800
  default-max-retries: 3
  retry-delays-seconds: 30,120,300
