# 以模板方式放入 /etc/nginx/templates/，容器启动时由 nginx 官方镜像的 envsubst 替换 ${...}。
# 各后端地址默认值见 Dockerfile.frontend；全容器模式由 docker-compose.jvm-analyzer.yml 覆盖。
# 路由与 octopus-frontend/vite.config.ts 的开发代理保持一致。
server {
    listen 3000;
    server_name localhost;

    # 业务测试执行、LLM 补全可能持续数分钟（前端 verification 超时 270s）
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 25m;   # Review 页面上传需求文档；JMeter 扩展 JAR（≤20 MB）

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # octopus-review-agent：/review/api/** → /api/**
    location /review/api/ {
        proxy_pass http://${REVIEW_HOST}/api/;
    }

    # octopus-scenario-runner：/business-testing/api/** 与 /scenarios/api/** → /api/**
    location /business-testing/api/ {
        proxy_pass http://${SCENARIO_HOST}/api/;
    }
    location /scenarios/api/ {
        proxy_pass http://${SCENARIO_HOST}/api/;
    }

    # octopus-code-reconstruct：/reconstruct/** → /api/**
    location /reconstruct/ {
        proxy_pass http://${RECONSTRUCT_HOST}/api/;
    }

    # code-intelligence（放在最后，前面更具体的前缀优先匹配）
    location /api/ {
        proxy_pass http://${API_HOST};
    }
}
