server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/octopus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

octopus:
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: ${NEO4J_PASSWORD:octpus123}

reconstruct:
  max-depth: 10
  max-classes: 50
  field-filter: true
  git:
    # 仓库存储根：与 code-intelligence 统一走 OCTOPUS_REPO_ROOT（同一网络卷、同一路径语义）。
    # GitSourceProvider 通过此路径 + repoUrl 提取的仓库名定位本地 clone。
    local-repo-base: ${OCTOPUS_REPO_ROOT:/data/repos}
