# ── IDEA installation path ──────────────────────────────────────────────
# Avoids downloading IDEA via Gradle. Uncomment and set to your local path.
# Priority: -PideaHome=... > IDEA_HOME env var > this file > auto-download
#
# macOS example:
#ideaHome=/Applications/IntelliJ IDEA 2.app
#
# Linux example:
#ideaHome=/opt/idea/IC-2025.3
#
# Platform type (IU = Ultimate, IC = Community)
#platformType=IU
#platformVersion=2025.3

ideaHome=/Applications/IntelliJ IDEA 2.app
