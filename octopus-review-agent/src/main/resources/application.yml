server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/octopus?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

review:
  query-service:
    url: ${QUERY_SERVICE_URL:http://localhost:8080}
  reconstruct:
    url: http://localhost:8082
    connect-timeout: 5000
    read-timeout: 30000

memory:
  confidence:
    confirm-threshold: 3
    establish-threshold: 5
