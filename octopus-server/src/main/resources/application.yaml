spring:
  application:
    name: octopus

  git:
    host: localhost:29418
    username: octopus
    password: ${GITHUB_TOKEN}
    local-repo-base: /data/repos

  datasource:
    url: jdbc:mysql://localhost:3306/octopus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

octopus:
  encryption:
    secret-key: 0123456789abcdef0123456789abcdef   # MUST be 16, 24, or 32 bytes for AES; change in production!
  neo4j:
    uri: bolt://localhost:7687
    username: neo4j
    password: ${NEO4J_PASSWORD:octpus123}
  psi:
    jar-path: /opt/octopus/octopus-psi.jar
    timeout-seconds: 1500     # 25 min per module: covers indexing (1200s) + analysis time
    service-url: http://localhost:8377     # HTTP mode: requires PSI service started via ./run-psi-local.sh
    connect-retry-attempts: 3         # Number of attempts before giving up (ConnectException / 503)
    connect-retry-interval-seconds: 5 # Wait between retries (IntelliJ takes ~30-120s to start)
  git:
    shallow-clone: true
    local-repo-ttl-days: 30
    local-repo-max-count: 50
    local-repo-max-size-gb: 100
    service-url: http://localhost:8081     # git service runs in Docker, port-mapped to localhost:8081
